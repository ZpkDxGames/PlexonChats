# =============================================
#         PlexonChats Configuration
# =============================================
# MiniMessage formatting is fully supported!
# Reference: https://docs.advntr.dev/minimessage/format.html

# Default channel players join when connecting
default-channel: LOCAL

# ---- Channel Settings ----
channels:
  local:
    enabled: true
    # Radius in blocks (players beyond this won't see local messages)
    radius: 100
    # Format supports: {player}, {message}, {world}
    format: "<gradient:#f1d374:#f7e08f>[L]</gradient> <gray>{player} <dark_gray>» <gray>{message}"
    # Prefix required to talk in this channel without switching (leave empty to disable)
    shortcut-prefix: ""
    # Message shown when no one is nearby
    no-recipients-message: "<gray><italic>No one is nearby to hear you..."

  global:
    enabled: true
    format: "<gradient:#6ea8ff:#88beff>[G]</gradient> <white>{player} <dark_gray>» <white>{message}"
    # Prefix to quickly send a global message (e.g., typing "!hello" sends "hello" globally)
    shortcut-prefix: "!"

# ---- Mention Settings ----
mentions:
  enabled: true
  # Format for @playername in chat
  format: "<gradient:#00e6ff:#00ffac>@{player}</gradient>"
  actionbar-message: "<gray>[<gradient:#00e6ff:#00ffac>{player}</gradient><gray>] mentioned you in chat!"
  # Sound played to the mentioned player
  sound: BLOCK_NOTE_BLOCK_PLING
  sound-volume: 1.0
  sound-pitch: 1.5

# ---- Item Display Settings ----
item-display:
  enabled: true
  # Placeholders that trigger item display: [item], @hand
  triggers:
    - "[item]"
    - "@hand"
  # Format for the item display (hover shows full item tooltip)
  format: "<gradient:#ffd66b:#ffe58f>@hand</gradient>: <yellow>{item_name}"
  # Message when player holds no item
  empty-hand-message: "<gray><italic>[Empty Hand]</italic></gray>"

# ---- GUI Settings ----
gui:
  title: "<gradient:#00e6ff:#00ffac><bold>PlexonChats</bold></gradient>"
  rows: 3

# ---- Messages ----
messages:
  prefix: "<b><gradient:#00e6ff:#00ffac>Plexon Chats</gradient></b> <dark_gray>» "
  channel-switched: "<green>You switched to the <white>{channel}<green> channel."
  channel-already: "<yellow>You are already in the <white>{channel}<yellow> channel."
  no-permission: "<red>You don't have permission to do that."
  config-reloaded: "<green>Configuration reloaded successfully!"
  player-only: "<red>This command can only be used by players."
  unknown-channel: "<red>Unknown channel: <white>{channel}"
  announcement-format: "{message}"
  player-not-found: "<red>Player not found: <white>{player}"
  no-reply-target: "<red>You have no one to reply to."
