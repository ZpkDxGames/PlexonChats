name: PlexonChats
version: '${project.version}'
main: com.antondev.chats.PlexonChats
api-version: '26.2'
description: A powerful, configurable chat management plugin for Paper servers
authors: [Tonim, ZpkDxGames]
softdepend:
  - PlexonCore
  - Vault
  - PlaceholderAPI
  - LuckPerms
  - PlexonRanks
  - PlexonKeys
  - DiscordSRV

commands:
  chat:
    description: Main PlexonChats command
    usage: /chat <channel|gui|admin|reload|status|diagnostics|automessages|events>
    permission: plexonchats.use
  g:
    description: Quick global chat shortcut
    usage: /g <message>
    permission: plexonchats.global
  l:
    description: Quick local chat shortcut
    usage: /l <message>
    permission: plexonchats.local
  announce:
    description: Broadcast announcement to all players
    usage: /announce <message>
    aliases: [broadcast, bc]
    permission: plexonchats.announce
  msg:
    description: Send private message to a player
    usage: /msg <player> <message>
    aliases: [tell, w]
    permission: plexonchats.tell
  reply:
    description: Reply to your last private message
    usage: /reply <message>
    aliases: [r]
    permission: plexonchats.tell
  chatitem:
    description: Open a chat item preview token
    usage: /chatitem <token>
    permission: plexonchats.item

permissions:
  plexonchats.use:
    description: Allows using the /chat command
    default: true
  plexonchats.global:
    description: Allows using global chat
    default: true
  plexonchats.local:
    description: Allows using local chat
    default: true
  plexonchats.mention:
    description: Allows mentioning other players
    default: true
  plexonchats.item:
    description: Allows showing items in chat
    default: true
  plexonchats.gui:
    description: Allows opening the chat GUI
    default: true
  plexonchats.reload:
    description: Allows reloading the plugin config
    default: op
  plexonchats.announce:
    description: Allows using announcement broadcast commands
    default: op
  plexonchats.tell:
    description: Allows sending private messages
    default: true
  plexonchats.events:
    description: View Chat Events status, list and help
    default: op
  plexonchats.events.manage:
    description: Enable, disable, pause, resume, start, stop and preview Chat Events
    default: op
  plexonchats.admin:
    description: Full admin access to PlexonChats
    default: op
    children:
      plexonchats.use: true
      plexonchats.global: true
      plexonchats.local: true
      plexonchats.mention: true
      plexonchats.item: true
      plexonchats.gui: true
      plexonchats.reload: true
      plexonchats.announce: true
      plexonchats.tell: true
      plexonchats.manage: true
      plexonchats.automessages: true
      plexonchats.events: true
      plexonchats.events.manage: true
      plexonchats.formatting: true
      plexonchats.formatting.advanced: true
      plexonchats.bypass.cooldown: true
      plexonchats.bypass.private: true
  plexonchats.manage:
    description: Open the administration GUI and view integration status
    default: op
  plexonchats.automessages:
    description: Preview, test, broadcast, pause and manage scheduled messages
    default: op
  plexonchats.formatting:
    description: Use colors, decorations and gradients in messages
    default: true
  plexonchats.formatting.advanced:
    description: Use advanced MiniMessage tags in player messages (trusted staff only)
    default: op
  plexonchats.bypass.cooldown:
    description: Bypass chat cooldown and duplicate-message protection
    default: op
  plexonchats.bypass.private:
    description: Send private messages to players who disabled receiving them
    default: op
  plexonchats.connection.silent:
    description: Suppress this player's custom join and quit messages
    default: false
