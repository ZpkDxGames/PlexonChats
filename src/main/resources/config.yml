# ============================================================
# PlexonChats 3.3 — Chat Events / Paper 26.2 / Java 25
# All admin-owned text supports MiniMessage. UTF-8, spaces only.
# /chat reload validates the complete candidate before activation.
# Existing settings are retained, with a backup before schema migration.
# ============================================================
config-version: 5
server-name: "Plexon"
default-channel: LOCAL

channels:
  local:
    enabled: true
    radius: 100
    format: "{channel_badge} {rank_prefix}{player}{separator}<gray>{message}"
    badge: "<gradient:#f1d374:#f7e08f>[L]</gradient>"
    shortcut-prefix: ""
    no-recipients-message: "<gray><italic>No one is nearby to hear you...</italic>"
    receive-permission: ""
  global:
    enabled: true
    format: "{channel_badge} {rank_prefix}{player}{separator}<white>{message}"
    badge: "<gradient:#6ea8ff:#88beff>[G]</gradient>"
    shortcut-prefix: "!"
    receive-permission: ""

chat-components:
  player:
    name-format: "<white>{display_name}</white>"
    hover:
      enabled: true
      lines:
        - "<gradient:#6ea8ff:#88d8ff><bold>PLAYER PROFILE</bold></gradient>"
        - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━"
        - "<gray>Name <dark_gray>› <white>{player_name}"
        - "<gray>Rank <dark_gray>› <white>{rank}"
        - ""
        - "<gray>World <dark_gray>› <white>{world}"
        - "<gray>Playtime <dark_gray>› <white>{playtime}"
        - "<gray>Balance <dark_gray>› <gold>{balance}"
        - "<gray>Connection <dark_gray>› <green>{ping} ms"
        - ""
        - "<aqua>Click to send a private message"
    click:
      action: SUGGEST_COMMAND
      value: "/msg {player_name} "
  channel:
    hover:
      enabled: true
      lines:
        - "<white><bold>{channel} chat</bold></white>"
        - "<gray>Click to switch your outgoing channel."
    click:
      action: RUN_COMMAND
      value: "/chat channel {channel_id}"
  separator:
    format: " <dark_gray>» </dark_gray>"
    hover:
      enabled: false
      lines: ["<gray>Message {player_name}"]
    click:
      action: NONE
      value: "/msg {player_name} "

formatting:
  allow-advanced-player-tags: false

chat:
  max-message-length: 512
  cooldown-milliseconds: 1000
  duplicate-window-seconds: 5
  log-to-console: true

private-messages:
  enabled: true
  sent-format: "<gray>[To] {target}<dark_gray> » <white>{message}"
  received-format: "<gray>[From] {sender}<dark_gray> » <white>{message}"

connection-messages:
  respect-hidden: true
  silent-permission: "plexonchats.connection.silent"
  join:
    mode: DEFAULT
    format: "<dark_gray>[<green>+</green>]</dark_gray> {player} <gray>joined <dark_gray>• <gray>{online}/{max_players}"
    first-join-format: ""
  quit:
    mode: DEFAULT
    format: "<dark_gray>[<red>−</red>]</dark_gray> {player} <gray>left <dark_gray>• <gray>{online}/{max_players}"

mentions:
  enabled: true
  format: "<gradient:#00e6ff:#00ffac>@{player}</gradient>"
  actionbar-message: "<aqua>{player}</aqua><gray> mentioned you in chat!"
  sound: BLOCK_NOTE_BLOCK_PLING
  sound-volume: 1.0
  sound-pitch: 1.5

item-display:
  enabled: true
  triggers: ["[item]", "@hand"]
  format: "<gradient:#ffd66b:#ffe58f>✦</gradient> {item_name} <gray>×{amount}"
  empty-hand-message: "<gray><italic>[Empty Hand]</italic></gray>"
  hover-item: true
  click-preview: true
  preview:
    expire-seconds: 1800
    max-entries: 1000
    title: "<gradient:#ffd66b:#ffe58f>Hand Item Preview</gradient>"

preferences:
  save-interval-seconds: 60

# GUI slots are zero-based. Actions include the normal player/admin actions plus:
# OPEN_CHAT_EVENTS, TOGGLE_CHAT_EVENTS, PAUSE_CHAT_EVENTS, RESUME_CHAT_EVENTS,
# START_RANDOM_CHAT_EVENT and STOP_CHAT_EVENT.
gui:
  enabled: true
  title: "<gradient:#88beff:#b9d8ff><bold>PlexonChats</bold></gradient>"
  rows: 3
  close-on-channel-select: false
  click-sound: UI_BUTTON_CLICK
  filler:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    mode: BORDER
    name: " "
  state:
    active: "<green>● Active"
    available: "<yellow>Click to activate"
    disabled: "<red>Unavailable"
    locked: "<red>No permission"
    on: "<green>● Enabled"
    off: "<gray>○ Disabled"
  items:
    local:
      slot: 10
      action: LOCAL
      material: WHITE_WOOL
      active-material: LIME_CONCRETE
      disabled-material: GRAY_DYE
      glow-when-active: true
      name: "<gradient:#f1d374:#f7e08f><bold>Local chat</bold></gradient>"
      lore: ["<gray>Talk to nearby players in your world.", "<gray>Range <dark_gray>› <white>{radius} blocks", "", "{state}"]
    global:
      slot: 12
      action: GLOBAL
      material: LIGHT_BLUE_WOOL
      active-material: LIME_CONCRETE
      disabled-material: GRAY_DYE
      glow-when-active: true
      name: "<gradient:#6ea8ff:#88beff><bold>Global chat</bold></gradient>"
      lore: ["<gray>Talk across the server.", "<gray>Shortcut <dark_gray>› <white>{global_shortcut}", "", "{state}"]
    mentions:
      slot: 14
      action: TOGGLE_MENTIONS
      material: NOTE_BLOCK
      name: "<aqua><bold>Mention alerts</bold></aqua>"
      lore: ["<gray>Toggle sound and action-bar alerts.", "", "{state}"]
    tips:
      slot: 16
      action: TOGGLE_TIPS
      material: PAPER
      name: "<gold><bold>Server tips</bold></gold>"
      lore: ["<gray>Toggle optional scheduled tips.", "", "{state}"]
    private-messages:
      slot: 20
      action: TOGGLE_PRIVATE_MESSAGES
      material: WRITABLE_BOOK
      name: "<white><bold>Private messages</bold></white>"
      lore: ["<gray>Allow players to send you messages.", "<gray>Authorized staff may bypass this.", "", "{state}"]
    admin:
      slot: 22
      action: OPEN_ADMIN
      permission: plexonchats.manage
      hide-without-permission: true
      material: COMPARATOR
      name: "<aqua><bold>Administration</bold></aqua>"
      lore: ["<gray>Manage, preview and reload settings."]
    creator:
      slot: 24
      action: OPEN_CREATOR
      material: BOOK
      name: "<white><bold>About PlexonChats</bold></white>"
      lore: ["<gray>Version {version}", "<gray>Created by Tonim / ZpkDxGames"]
    close:
      slot: 26
      action: CLOSE
      material: BARRIER
      name: "<red>Close"
      lore: []

  admin:
    title: "<gradient:#88beff:#b9d8ff><bold>Chat administration</bold></gradient>"
    rows: 3
    items:
      reload:
        slot: 10
        action: RELOAD
        permission: plexonchats.reload
        material: REPEATER
        name: "<green><bold>Reload configuration</bold></green>"
        lore: ["<gray>Apply config.yml changes safely.", "<gray>Invalid YAML keeps the live settings."]
      scheduler:
        slot: 12
        action: TOGGLE_AUTO_MESSAGES
        permission: plexonchats.automessages
        material: CLOCK
        name: "<gold><bold>Scheduled messages</bold></gold>"
        lore: ["<gray>Groups <dark_gray>› <white>{auto_groups}", "<gray>Status <dark_gray>› <white>{auto_status}", "<gray>Toggle is saved to config.yml.", "", "{state}"]
      preview:
        slot: 14
        action: PREVIEW_FORMAT
        material: NAME_TAG
        name: "<aqua><bold>Preview chat formats</bold></aqua>"
        lore: ["<gray>Show local/global previews only to you.", "<gray>Hover your nickname to inspect it."]
      integration:
        slot: 16
        action: NONE
        material: IRON_CHAIN
        name: "<blue><bold>DiscordSRV</bold></blue>"
        lore: ["<gray>Status <dark_gray>› <white>{discord_status}", "<gray>Configure integrations.discordsrv.", "<gray>Local chat and PMs stay private."]
      chat-events:
        slot: 20
        action: OPEN_CHAT_EVENTS
        permission: plexonchats.events.manage
        hide-without-permission: true
        material: BELL
        name: "<gold><bold>Chat Events</bold></gold>"
        lore: ["<gray>Status <dark_gray>› <white>{events_status}", "<gray>Open the event control page."]
      back:
        slot: 22
        action: OPEN_MAIN
        material: ARROW
        name: "<white>Back"
        lore: []
      close:
        slot: 26
        action: CLOSE
        material: BARRIER
        name: "<red>Close"
        lore: []

  events:
    title: "<gradient:#ffd66b:#ff9f43><bold>Chat Events</bold></gradient>"
    rows: 3
    items:
      master:
        slot: 10
        action: TOGGLE_CHAT_EVENTS
        permission: plexonchats.events.manage
        material: LEVER
        active-material: LIME_CONCRETE
        name: "<gold><bold>Master toggle</bold></gold>"
        lore: ["<gray>Persistent feature state.", "<gray>Status <dark_gray>› <white>{events_status}", "", "{state}"]
      status:
        slot: 12
        action: NONE
        material: CLOCK
        name: "<aqua><bold>Runtime status</bold></aqua>"
        lore: ["<gray>Scheduler <dark_gray>› <white>{events_scheduler}", "<gray>Active <dark_gray>› <white>{events_active}", "<gray>Definitions <dark_gray>› <white>{events_count}"]
      pause:
        slot: 14
        action: PAUSE_CHAT_EVENTS
        material: REDSTONE_TORCH
        disabled-material: GRAY_DYE
        name: "<yellow><bold>Pause scheduling</bold></yellow>"
        lore: ["<gray>Runtime-only pause. Active events continue.", "", "{state}"]
      resume:
        slot: 16
        action: RESUME_CHAT_EVENTS
        material: LIME_DYE
        disabled-material: GRAY_DYE
        name: "<green><bold>Resume scheduling</bold></green>"
        lore: ["<gray>Resume automatic event selection.", "", "{state}"]
      start:
        slot: 19
        action: START_RANDOM_CHAT_EVENT
        material: FIREWORK_ROCKET
        disabled-material: GRAY_DYE
        name: "<aqua><bold>Start random event</bold></aqua>"
        lore: ["<gray>Start one eligible playable event now.", "", "{state}"]
      stop:
        slot: 21
        action: STOP_CHAT_EVENT
        material: BARRIER
        disabled-material: GRAY_DYE
        name: "<red><bold>Stop active event</bold></red>"
        lore: ["<gray>Cancel with no winner and no reward.", "", "{state}"]
      back:
        slot: 23
        action: OPEN_ADMIN
        material: ARROW
        name: "<white>Back"
        lore: []
      close:
        slot: 25
        action: CLOSE
        material: BARRIER
        name: "<red>Close"
        lore: []

  creator:
    title: "<white><bold>About PlexonChats</bold></white>"
    rows: 3
    items:
      info:
        slot: 4
        action: NONE
        material: BOOK
        name: "<aqua><bold>Tonim / ZpkDxGames</bold></aqua>"
        lore: ["<gray>PlexonChats {version}", "<gray>Plugin creator and maintainer"]
      discord:
        slot: 10
        action: LINK
        value: "https://discord.com/users/348426610095161355"
        material: LIGHT_BLUE_CONCRETE
        name: "<aqua>Creator Discord"
        lore: ["<gray>Receive a clickable contact link."]
      projects:
        slot: 13
        action: LINK
        value: "https://www.spigotmc.org/resources/authors/tonim.2341103/"
        material: BOOKSHELF
        name: "<gold>Other projects"
        lore: ["<gray>Visit the creator's Spigot resources."]
      github:
        slot: 16
        action: LINK
        value: "https://github.com/ZpkDxGames/PlexonChats"
        material: END_CRYSTAL
        name: "<white>GitHub"
        lore: ["<gray>Source code and documentation."]
      back:
        slot: 22
        action: OPEN_MAIN
        material: ARROW
        name: "<white>Back"
        lore: []
      close:
        slot: 26
        action: CLOSE
        material: BARRIER
        name: "<red>Close"
        lore: []

# Scheduled informational messages remain a separate subsystem from Chat Events.
auto-messages:
  enabled: true
  groups:
    tips:
      enabled: true
      interval-seconds: 300
      initial-delay-seconds: 60
      order: SHUFFLE
      min-online: 1
      respect-tip-preference: true
      permission: ""
      worlds: []
      excluded-worlds: []
      sound: BLOCK_NOTE_BLOCK_PLING
      sound-volume: 1.0
      sound-pitch: 1.1
      forward-to-discord: false
      messages:
        - id: chat-menu
          delivery: CHAT
          lines:
            - ""
            - "<gradient:#88beff:#b9d8ff><bold>✦ QUICK TIP</bold></gradient>"
            - "<gray>Hi {player_name}! Open <click:run_command:'/chat gui'><aqua>/chat gui</aqua></click> to choose your channel and alerts."
            - ""
        - id: global-chat
          delivery: CHAT
          lines: ["<gold>✦</gold> <gray>Start a message with <white>!</white> to talk in global chat."]
        - id: item-showcase
          delivery: CHAT
          lines: ["<gold>✦</gold> <gray>Share your held item by typing <yellow>[item]</yellow> in chat."]
    announcements:
      enabled: true
      interval-seconds: 900
      initial-delay-seconds: 180
      order: SEQUENTIAL
      min-online: 1
      respect-tip-preference: false
      permission: ""
      worlds: []
      excluded-worlds: []
      sound: NONE
      forward-to-discord: false
      messages:
        - id: welcome
          delivery: CHAT
          lines: ["<gradient:#6ea8ff:#88d8ff><bold>PLEXON</bold></gradient> <dark_gray>» <gray>Be kind, enjoy the server, and help new players feel welcome."]

# One lightweight coordinator services all definitions. Only one run may be active.
chat-events:
  enabled: true
  scheduler:
    enabled: true
    initial-delay-seconds: 180
    min-interval-seconds: 600
    max-interval-seconds: 1200
    min-online: 1
    avoid-immediate-repeat: true
    pause-when-empty: true
  defaults:
    duration-seconds: 30
    reveal-answer-on-timeout: true
    min-online: 1
    permission: ""
    worlds: []
    excluded-worlds: []
    accepted-channels: [LOCAL, GLOBAL]
    matching:
      case-sensitive: false
      trim: true
      collapse-whitespace: true
      unicode-normalization: NFKC
      ignore-diacritics: false
  reward-profiles:
    basic:
      economy:
        enabled: true
        amount: 500.0
      plexonkeys:
        enabled: false
        tier: BASIC
        amount: 0
      console-commands: []
    rare:
      economy:
        enabled: true
        amount: 2500.0
      plexonkeys:
        enabled: true
        tier: RARE
        amount: 1
      console-commands: []
    epic:
      economy:
        enabled: true
        amount: 5000.0
      plexonkeys:
        enabled: true
        tier: EPIC
        amount: 1
      console-commands: []
  events:
    bingo:
      enabled: true
      type: TYPE
      weight: 12
      cooldown-seconds: 1800
      reward-profile: basic
      values: ["bingo", "plexon", "diamond", "redstone"]
      prompt: "<gold><bold>CHAT EVENT</bold></gold> <dark_gray>» <gray>Type <yellow>\"{value}\"</yellow> first!"
    unscramble:
      enabled: true
      type: UNSCRAMBLE
      weight: 10
      cooldown-seconds: 1800
      reward-profile: rare
      words: ["diamond", "redstone", "village", "elytra", "netherite"]
      prompt: "<gold><bold>CHAT EVENT</bold></gold> <dark_gray>» <gray>Unscramble <aqua>{scrambled}</aqua>!"
    math-normal:
      enabled: true
      type: MATH
      weight: 10
      cooldown-seconds: 1200
      reward-profile: rare
      operations: [ADD, SUBTRACT, MULTIPLY]
      min-operand: 2
      max-operand: 25
      allow-negative-result: false
      prompt: "<gold><bold>CHAT EVENT</bold></gold> <dark_gray>» <gray>What's <aqua>{expression}</aqua>?"
    math-hard:
      enabled: true
      type: MATH
      weight: 4
      cooldown-seconds: 3600
      reward-profile: epic
      operations: [MULTIPLY, DIVIDE]
      min-operand: 8
      max-operand: 75
      allow-negative-result: false
      prompt: "<gold><bold>CHAT EVENT</bold></gold> <dark_gray>» <gray>Solve <red>{expression}</red>!"
    trivia:
      enabled: true
      type: TRIVIA
      weight: 6
      cooldown-seconds: 2400
      reward-profile: rare
      entries:
        - question: "Which dimension contains End Cities?"
          accepted-answers: ["the end", "end"]
        - question: "Which ore is required to craft an enchanting table?"
          accepted-answers: ["diamond", "diamonds"]
      prompt: "<gold><bold>CHAT EVENT</bold></gold> <dark_gray>» <gray>{question}"
    reverse:
      enabled: true
      type: REVERSE
      weight: 6
      cooldown-seconds: 1800
      reward-profile: basic
      values: ["craft", "redstone", "plexon", "diamond"]
      prompt: "<gold><bold>CHAT EVENT</bold></gold> <dark_gray>» <gray>Reverse <aqua>{value}</aqua>!"
  sounds:
    start:
      sound: BLOCK_NOTE_BLOCK_PLING
      volume: 1.0
      pitch: 1.2
    win:
      sound: UI_TOAST_CHALLENGE_COMPLETE
      volume: 1.0
      pitch: 1.0
    timeout:
      sound: BLOCK_NOTE_BLOCK_BASS
      volume: 1.0
      pitch: 1.0
  messages:
    prefix: "<bold><gradient:#ffd66b:#ff9f43>Chat Event</gradient></bold> <dark_gray>» "
    started: "{prompt}"
    winner: "<green><bold>{winner}</bold></green> <gray>answered correctly in <white>{elapsed}</white>! <gray>Reward: {reward_summary}"
    timed-out: "<yellow>Time's up!</yellow> <gray>The answer was <white>{answer}</white>."
    cancelled: "<gray>The current chat event was cancelled."
    no-events: "<yellow>No eligible chat events are currently available."
    already-active: "<yellow>A chat event is already active: <white>{event_id}</white>."
    disabled: "<yellow>Chat Events are disabled."

integrations:
  discordsrv:
    enabled: false
    game-channel: "global"
    minecraft-to-discord: true
    discord-to-minecraft: true
    incoming-format: "{message}"
    receive-permission: ""
    suppress-mentions: true
    forward-announcements: false

messages:
  prefix: "<bold><gradient:#88beff:#b9d8ff>PlexonChats</gradient></bold> <dark_gray>» "
  channel-switched: "<green>You switched to the <white>{channel}</white> channel."
  channel-already: "<yellow>You are already in the <white>{channel}</white> channel."
  channel-disabled: "<red>{channel} chat is currently disabled."
  no-permission: "<red>You don't have permission to do that."
  config-reloaded: "<green>Configuration reloaded successfully."
  config-failed: "<red>Configuration could not be applied. Check the console; your live settings were kept."
  player-only: "<red>This command can only be used by players."
  unknown-channel: "<red>Unknown channel: <white>{channel}"
  announcement-format: "{message}"
  player-not-found: "<red>Player not found: <white>{player}"
  no-reply-target: "<red>You have no one to reply to."
  reply-target-offline: "<red>Your last conversation target is offline."
  private-disabled: "<red>Private messaging is disabled."
  private-blocked: "<yellow>This player is not accepting private messages."
  private-self: "<red>You cannot message yourself."
  empty-message: "<yellow>Please enter a message."
  message-too-long: "<red>Your message exceeds {limit} characters."
  message-newline: "<red>Messages must fit on one line."
  cooldown: "<yellow>Please wait {seconds}s before sending another message."
  duplicate-message: "<yellow>Please don't repeat the same message so quickly."
  gui-disabled: "<yellow>The chat GUI is currently disabled."
  gui-button-disabled: "<yellow>This feature is currently disabled by the server."
  preference-updated: "<green>Preference saved: <white>{setting}</white> = {state}"
  link: "<aqua><underlined>Click to open {label}</underlined></aqua>"
  auto-disabled: "<yellow>Scheduled messages are disabled in config.yml."
  auto-paused: "<yellow>Scheduled messages paused until resume/reload."
  auto-resumed: "<green>Scheduled messages resumed."
  auto-not-found: "<red>Unknown message group: {group}"
  auto-sent: "<green>Sent {group} to {count} eligible player(s)."
  auto-none: "<yellow>No eligible recipients or enabled messages in {group}."
  auto-status: "<gray>Scheduler <dark_gray>› <white>{state}</white> <gray>Groups <dark_gray>› <white>{groups}"
  status: "<gray>PlexonChats {version} <dark_gray>• <gray>DiscordSRV: <white>{discord}</white> <dark_gray>• <gray>Auto-messages: <white>{scheduler}</white> <dark_gray>• <gray>Chat Events: <white>{events}</white>"
