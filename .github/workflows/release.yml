name: Release

on:
  push:
    tags:
      - 'v3.2.0-rc.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Phase 2 ancestry and tag
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c7191c21654b11ea55c03e5fecae629e20898319 HEAD
          project_version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          test "${GITHUB_REF_NAME}" = "v${project_version}"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Provision PlexonCore 2.0.4 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error --output "${core_jar}" "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile="${core_jar}" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true

      - name: Test and package exact tag
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp clean verify 2>&1 | tee maven-release-verify.log

      - name: Build exact test summary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          reports = sorted(Path("target/surefire-reports").glob("TEST-*.xml"))
          if not reports:
              raise SystemExit("No Surefire XML reports found")
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          text = (
              f"executed={totals['tests']}\n"
              f"failures={totals['failures']}\n"
              f"errors={totals['errors']}\n"
              f"skipped={totals['skipped']}\n"
          )
          Path("target/TEST_SUMMARY.txt").write_text(text, encoding="utf-8")
          print(text, end="")
          if totals["failures"] or totals["errors"] or totals["skipped"]:
              raise SystemExit("Release contract requires zero failures, errors and skipped tests")
          PY

      - name: Verify distribution and provenance
        shell: bash
        run: |
          set -euo pipefail
          jar_path='target/PlexonChats-3.2.0-rc.1.jar'
          test -s "${jar_path}"
          jar tf "${jar_path}" > target/jar-contents.txt
          for resource in plugin.yml config.yml com/antondev/chats/PlexonChats.class com/antondev/chats/api/PlexonChatEvent.class com/antondev/chats/api/PlexonChatsAPI.class com/antondev/chats/diagnostics/ChatDiagnostics.class; do
            grep -qx "${resource}" target/jar-contents.txt
          done
          for prefix in 'com/zpkdxgames/plexoncore/' 'github/scarsz/discordsrv/' 'io/papermc/paper/' 'org/bukkit/' 'net/kyori/adventure/' 'me/clip/placeholderapi/' 'net/luckperms/'; do
            if grep -q "^${prefix}" target/jar-contents.txt; then echo "Provided/runtime API classes must not be bundled: ${prefix}" >&2; exit 1; fi
          done
          unzip -p "${jar_path}" plugin.yml | grep -F "version: '3.2.0-rc.1'"
          javap -verbose -classpath "${jar_path}" com.antondev.chats.PlexonChats | grep -F 'major version: 69'
          (
            cd target
            sha256sum PlexonChats-3.2.0-rc.1.jar > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          cat > target/PROVENANCE.txt <<EOF
          repository=ZpkDxGames/PlexonChats
          commit=${GITHUB_SHA}
          tag=${GITHUB_REF_NAME}
          candidate=3.2.0-rc.1
          rollback_tag=v3.1.1
          rollback_sha=c7191c21654b11ea55c03e5fecae629e20898319
          java=25
          class_major=69
          paper=26.2.build.121-stable
          plexoncore=2.0.4
          runtime_certification=NOT_EXECUTED
          EOF

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: PlexonChats 3.2.0-rc.1
          body_path: .release/3.2.0-rc.1.md
          prerelease: true
          make_latest: false
          files: |
            target/PlexonChats-3.2.0-rc.1.jar
            target/SHA256SUMS.txt
            target/TEST_SUMMARY.txt
            target/PROVENANCE.txt

      - name: Verify published prerelease metadata and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "${GITHUB_REF_NAME}" --json isPrerelease --jq '.isPrerelease')" = true
          test "$(gh release view "${GITHUB_REF_NAME}" --json tagName --jq '.tagName')" = "${GITHUB_REF_NAME}"
          assets=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')
          for asset in PlexonChats-3.2.0-rc.1.jar SHA256SUMS.txt TEST_SUMMARY.txt PROVENANCE.txt; do
            grep -qx "${asset}" <<<"${assets}"
          done

      - name: Upload release verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Release-verify-${{ github.sha }}
          path: maven-release-verify.log
          if-no-files-found: warn
          retention-days: 7
