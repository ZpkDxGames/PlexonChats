name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify 3.0 release ancestry
        shell: bash
        run: git merge-base --is-ancestor 4bff64e1691e79f0199baace428ec4349be9400b HEAD

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Provision PlexonCore 1.0.0 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-1.0.0.jar"
          curl --fail --location --silent --show-error \
            --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v1.0.0/PlexonCore-1.0.0.jar"
          echo "4abce6de93293e21b31cb874734430d5bdc77de17a4c3b98fd6a9006e1f13018  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=1.0.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Verify tag matches project version
        shell: bash
        run: |
          set -euo pipefail
          project_version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          test "${GITHUB_REF_NAME}" = "v${project_version}"

      - name: Test and package
        run: mvn -B -ntp clean verify

      - name: Verify distribution and checksums
        shell: bash
        run: |
          set -euo pipefail
          jar_path='target/PlexonChats-3.1.0.jar'
          test -s "${jar_path}"
          jar tf "${jar_path}" > target/jar-contents.txt
          grep -qx 'plugin.yml' target/jar-contents.txt
          grep -qx 'config.yml' target/jar-contents.txt
          grep -qx 'com/antondev/chats/PlexonChats.class' target/jar-contents.txt
          grep -qx 'com/antondev/chats/api/PlexonChatEvent.class' target/jar-contents.txt
          grep -qx 'com/antondev/chats/api/PlexonChatsAPI.class' target/jar-contents.txt
          for prefix in \
            'com/zpkdxgames/plexoncore/' \
            'github/scarsz/discordsrv/' \
            'io/papermc/paper/'; do
            if grep -q "^${prefix}" target/jar-contents.txt; then
              echo "Provided runtime classes must not be bundled: ${prefix}" >&2
              exit 1
            fi
          done
          cd target
          sha256sum PlexonChats-3.1.0.jar > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: PlexonChats 3.1.0
          body_path: docs/RELEASE-3.1.0.md
          make_latest: true
          files: |
            target/PlexonChats-3.1.0.jar
            target/SHA256SUMS.txt
