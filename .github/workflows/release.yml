name: Release

on:
  push:
    branches:
      - 'release/stable'

permissions:
  contents: write

concurrency:
  group: plexonchats-stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact stable candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Provision PlexonCore 2.0.4 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error --output "${core_jar}" "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile="${core_jar}" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true

      - name: Read project version
        id: project
        shell: bash
        run: echo "version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" >> "$GITHUB_OUTPUT"

      - name: Verify stable boundary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.project.outputs.version }}'
          test "${GITHUB_REF_NAME}" = 'release/stable'
          case "${VERSION}" in *-*) echo "Stable workflow refuses prerelease version: ${VERSION}" >&2; exit 1;; esac
          git fetch origin main
          test "${GITHUB_SHA}" = "$(git rev-parse origin/main)"
          git merge-base --is-ancestor f88d15263ea4e43c0228de0cae281e3940bfd36e HEAD
          test -s ".release/${VERSION}.md"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then echo "v${VERSION} release already exists" >&2; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then echo "v${VERSION} tag already exists" >&2; exit 1; fi

      - name: Test and package exact stable source
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp clean verify 2>&1 | tee maven-release-verify.log

      - name: Build exact test summary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          reports = sorted(Path("target/surefire-reports").glob("TEST-*.xml"))
          if not reports:
              raise SystemExit("No Surefire XML reports found")
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          text = "".join(f"{key}={value}\n" for key, value in (("executed", totals["tests"]), ("failures", totals["failures"]), ("errors", totals["errors"]), ("skipped", totals["skipped"])))
          Path("target/TEST_SUMMARY.txt").write_text(text, encoding="utf-8")
          print(text, end="")
          if totals["tests"] == 0 or totals["failures"] or totals["errors"] or totals["skipped"]:
              raise SystemExit("Release contract requires a non-empty all-green test suite")
          PY

      - name: Verify distribution and provenance
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.project.outputs.version }}'
          JAR="target/PlexonChats-${VERSION}.jar"
          test -s "${JAR}"
          jar tf "${JAR}" > target/jar-contents.txt
          for resource in \
            plugin.yml \
            config.yml \
            com/antondev/chats/PlexonChats.class \
            com/antondev/chats/api/PlexonChatEvent.class \
            com/antondev/chats/api/PlexonChatsAPI.class \
            com/antondev/chats/diagnostics/ChatDiagnostics.class \
            com/antondev/chats/event/ChatEventManager.class \
            com/antondev/chats/event/ChatEventEngine.class \
            com/antondev/chats/event/ChatEventConfig.class \
            com/antondev/chats/event/ChatEventRewardService.class; do
            grep -qx "${resource}" target/jar-contents.txt
          done
          for prefix in \
            'com/zpkdxgames/plexoncore/' \
            'com/antondev/keys/' \
            'github/scarsz/discordsrv/' \
            'io/papermc/paper/' \
            'org/bukkit/' \
            'net/kyori/adventure/' \
            'me/clip/placeholderapi/' \
            'net/luckperms/'; do
            if grep -q "^${prefix}" target/jar-contents.txt; then
              echo "Provided/runtime API classes must not be bundled: ${prefix}" >&2
              exit 1
            fi
          done
          unzip -p "${JAR}" plugin.yml | grep -F "version: '${VERSION}'"
          unzip -p "${JAR}" plugin.yml | grep -F "api-version: '26.2'"
          unzip -p "${JAR}" META-INF/MANIFEST.MF | tr -d '\r' | grep -F "Implementation-Version: ${VERSION}"
          javap -verbose -classpath "${JAR}" com.antondev.chats.PlexonChats | grep -F 'major version: 69'
          (
            cd target
            sha256sum "PlexonChats-${VERSION}.jar" > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          cat > target/PROVENANCE.txt <<EOF
          repository=ZpkDxGames/PlexonChats
          commit=${GITHUB_SHA}
          tag=v${VERSION}
          version=${VERSION}
          rollback_tag=v3.2.0
          rollback_sha=f88d15263ea4e43c0228de0cae281e3940bfd36e
          java=25
          class_major=69
          paper=26.2.build.121-stable
          plexoncore=2.0.4
          source_closure=VERIFIED
          runtime_deployment=FOLLOW_UP_NON_BLOCKING
          EOF
          git diff --check

      - name: Publish GitHub stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.project.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PlexonChats ${{ steps.project.outputs.version }}
          body_path: .release/${{ steps.project.outputs.version }}.md
          prerelease: false
          files: |
            target/PlexonChats-${{ steps.project.outputs.version }}.jar
            target/SHA256SUMS.txt
            target/TEST_SUMMARY.txt
            target/PROVENANCE.txt

      - name: Verify published stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.project.outputs.version }}"
          test "$(gh release view "${TAG}" --json isPrerelease --jq '.isPrerelease')" = false
          test "$(gh release view "${TAG}" --json tagName --jq '.tagName')" = "${TAG}"
          assets=$(gh release view "${TAG}" --json assets --jq '.assets[].name')
          for asset in "PlexonChats-${{ steps.project.outputs.version }}.jar" SHA256SUMS.txt TEST_SUMMARY.txt PROVENANCE.txt; do grep -qx "${asset}" <<<"${assets}"; done

      - name: Upload release verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Release-verify-${{ github.sha }}
          path: maven-release-verify.log
          if-no-files-found: warn
          retention-days: 7
