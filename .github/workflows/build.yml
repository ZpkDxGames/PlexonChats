name: Network chat verification
on:
  push:
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Provision verified optional Core API
        run: |
          curl -fsSL https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar -o /tmp/PlexonCore.jar
          echo '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  /tmp/PlexonCore.jar' | sha256sum -c
          mvn -B -ntp install:install-file -Dfile=/tmp/PlexonCore.jar -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Verify source lineage and complete reactor
        run: |
          git merge-base --is-ancestor f98b1a233ca3fc68ac9d94a45dfc414d02634300 HEAD
          set -o pipefail
          mvn -B -ntp clean verify 2>&1 | tee maven-verify.log
      - name: Verify artifacts and test summary
        run: python3 scripts/verify-network-distribution.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Network-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            maven-verify.log
            protocol/target/surefire-reports/
            paper/target/surefire-reports/
            velocity/target/surefire-reports/
            dist/
          if-no-files-found: error
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: f98b1a233ca3fc68ac9d94a45dfc414d02634300
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Baseline on exact prior source
        run: |
          curl -fsSL https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar -o /tmp/PlexonCore.jar
          echo '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  /tmp/PlexonCore.jar' | sha256sum -c
          mvn -B -ntp install:install-file -Dfile=/tmp/PlexonCore.jar -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
          set -o pipefail
          mvn -B -ntp clean verify 2>&1 | tee baseline-verify.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Baseline-verification
          path: |
            baseline-verify.log
            target/surefire-reports/
