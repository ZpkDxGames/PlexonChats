name: Build

on:
  push:
    branches:
      - main
      - 'release/**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify 3.0 release ancestry
        shell: bash
        run: git merge-base --is-ancestor 4bff64e1691e79f0199baace428ec4349be9400b HEAD

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Provision PlexonCore 1.0.0 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-1.0.0.jar"
          curl --fail --location --silent --show-error \
            --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v1.0.0/PlexonCore-1.0.0.jar"
          echo "4abce6de93293e21b31cb874734430d5bdc77de17a4c3b98fd6a9006e1f13018  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=1.0.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Test and package
        run: mvn -B -ntp clean verify

      - name: Verify distribution
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find target -maxdepth 1 -type f -name 'PlexonChats-*.jar' -print)
          test "${#jars[@]}" -eq 1
          jar_path=${jars[0]}
          test -s "${jar_path}"
          jar tf "${jar_path}" > target/jar-contents.txt
          grep -qx 'plugin.yml' target/jar-contents.txt
          grep -qx 'config.yml' target/jar-contents.txt
          grep -qx 'com/antondev/chats/PlexonChats.class' target/jar-contents.txt
          grep -qx 'com/antondev/chats/api/PlexonChatEvent.class' target/jar-contents.txt
          grep -qx 'com/antondev/chats/api/PlexonChatsAPI.class' target/jar-contents.txt
          for prefix in \
            'com/zpkdxgames/plexoncore/' \
            'github/scarsz/discordsrv/' \
            'io/papermc/paper/'; do
            if grep -q "^${prefix}" target/jar-contents.txt; then
              echo "Provided runtime classes must not be bundled: ${prefix}" >&2
              exit 1
            fi
          done
          jar_name=$(basename "${jar_path}")
          test "${jar_name}" = 'PlexonChats-3.1.0.jar'
          cd target
          sha256sum "${jar_name}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Check whitespace
        run: git diff --check 4bff64e1691e79f0199baace428ec4349be9400b...HEAD

      - name: Upload verified plugin
        uses: actions/upload-artifact@v4
        with:
          name: PlexonChats-3.1.0-${{ github.sha }}
          path: |
            target/PlexonChats-3.1.0.jar
            target/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
