name: PlexonChats
version: '1.0'
main: com.antondev.chats.PlexonChats
api-version: '1.21'
description: A powerful, configurable chat management plugin for Paper servers
authors: [Plexon]
softdepend: [Vault, PlaceholderAPI]

commands:
  chat:
    description: Main PlexonChats command
    usage: /chat <channel|gui|reload>
    permission: plexonchats.use
  g:
    description: Quick global chat shortcut
    usage: /g <message>
    permission: plexonchats.global
  l:
    description: Quick local chat shortcut
    usage: /l <message>
    permission: plexonchats.local
  announce:
    description: Broadcast announcement to all players
    usage: /announce <message>
    aliases: [broadcast, bc]
    permission: plexonchats.announce
  msg:
    description: Send private message to a player
    usage: /msg <player> <message>
    aliases: [tell, w]
    permission: plexonchats.tell
  reply:
    description: Reply to your last private message
    usage: /reply <message>
    aliases: [r]
    permission: plexonchats.tell
  chatitem:
    description: Open a chat item preview token
    usage: /chatitem <token>
    permission: plexonchats.item

permissions:
  plexonchats.use:
    description: Allows using the /chat command
    default: true
  plexonchats.global:
    description: Allows using global chat
    default: true
  plexonchats.local:
    description: Allows using local chat
    default: true
  plexonchats.mention:
    description: Allows mentioning other players
    default: true
  plexonchats.item:
    description: Allows showing items in chat
    default: true
  plexonchats.gui:
    description: Allows opening the chat GUI
    default: true
  plexonchats.reload:
    description: Allows reloading the plugin config
    default: op
  plexonchats.announce:
    description: Allows using announcement broadcast commands
    default: op
  plexonchats.tell:
    description: Allows sending private messages
    default: true
  plexonchats.admin:
    description: Full admin access to PlexonChats
    default: op
    children:
      plexonchats.use: true
      plexonchats.global: true
      plexonchats.local: true
      plexonchats.mention: true
      plexonchats.item: true
      plexonchats.gui: true
      plexonchats.reload: true
      plexonchats.announce: true
      plexonchats.tell: true
